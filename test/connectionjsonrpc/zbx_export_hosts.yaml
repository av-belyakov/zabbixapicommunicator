          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.name=="ruby_file_descriptors")].value.max()'
          master_item:
            key: gitlab.get_metrics
          tags:
            - tag: component
              value: fds
        - name: 'GitLab: Ruby: File descriptors opened, min'
          type: DEPENDENT
          key: gitlab.ruby.file_descriptors.min
          history: 7d
          value_type: FLOAT
          description: 'Minimum number of opened file descriptors.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.name=="ruby_file_descriptors")].value.min()'
          master_item:
            key: gitlab.get_metrics
          tags:
            - tag: component
              value: fds
        - name: 'GitLab: Ruby: CPU  usage per second'
          type: DEPENDENT
          key: gitlab.ruby.process_cpu_seconds.rate
          history: 7d
          value_type: FLOAT
          units: s
          description: 'Average CPU time util in seconds.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.name=="ruby_process_cpu_seconds_total")].value.avg()'
              error_handler: DISCARD_VALUE
            - type: CHANGE_PER_SECOND
          master_item:
            key: gitlab.get_metrics
          tags:
            - tag: component
              value: cpu
        - name: 'GitLab: Ruby: File descriptors, max'
          type: DEPENDENT
          key: gitlab.ruby.process_max_fds
          history: 7d
          value_type: FLOAT
          description: 'Maximum number of open file descriptors per process.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.name=="ruby_process_max_fds")].value.avg()'
          master_item:
            key: gitlab.get_metrics
          tags:
            - tag: component
              value: fds
        - name: 'GitLab: Ruby: RSS memory, avg'
          type: DEPENDENT
          key: gitlab.ruby.process_resident_memory_bytes.avg
          history: 7d
          value_type: FLOAT
          units: B
          description: 'Average RSS Memory usage in bytes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.name=="ruby_process_resident_memory_bytes")].value.avg()'
          master_item:
            key: gitlab.get_metrics
          tags:
            - tag: component
              value: memory
        - name: 'GitLab: Ruby: RSS memory, max'
          type: DEPENDENT
          key: gitlab.ruby.process_resident_memory_bytes.max
          history: 7d
          value_type: FLOAT
          units: B
          description: 'Maximum RSS Memory usage in bytes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.name=="ruby_process_resident_memory_bytes")].value.max()'
          master_item:
            key: gitlab.get_metrics
          tags:
            - tag: component
              value: memory
        - name: 'GitLab: Ruby: RSS memory, min'
          type: DEPENDENT
          key: gitlab.ruby.process_resident_memory_bytes.min
          history: 7d
          value_type: FLOAT
          units: B
          description: 'Minimum RSS Memory usage in bytes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.name=="ruby_process_resident_memory_bytes")].value.min()'
          master_item:
            key: gitlab.get_metrics
          tags:
            - tag: component
              value: memory
        - name: 'GitLab: Ruby: First process start time'
          type: DEPENDENT
          key: gitlab.ruby.process_start_time_seconds.first
          history: 7d
          units: unixtime
          description: 'Minimum UNIX timestamp of ruby processes start time.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.name=="ruby_process_start_time_seconds")].value.min()'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 3h
          master_item:
            key: gitlab.get_metrics
          tags:
            - tag: component
              value: application
        - name: 'GitLab: Ruby: Last process start time'
          type: DEPENDENT
          key: gitlab.ruby.process_start_time_seconds.last
          history: 7d
          units: unixtime
          description: 'Maximum UNIX timestamp ruby processes start time.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.name=="ruby_process_start_time_seconds")].value.max()'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 3h
          master_item:
            key: gitlab.get_metrics
          tags:
            - tag: component
              value: application
        - name: 'GitLab: Ruby: Running_threads'
          type: DEPENDENT
          key: gitlab.ruby.threads_running
          history: 7d
          description: 'Number of running Ruby threads.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.name=="gitlab_ruby_threads_running_threads")].value.sum()'
          master_item:
            key: gitlab.get_metrics
          tags:
            - tag: component
              value: system
          triggers:
            - expression: 'nodata(/gitlab.cloud.gcm/gitlab.ruby.threads_running,30m)=1'
              name: 'GitLab: Failed to fetch info data'
              event_name: 'GitLab: Failed to fetch info data (or no data for 30m)'
              priority: WARNING
              description: 'Zabbix has not received a metrics data for the last 30 minutes'
              manual_close: 'YES'
              dependencies:
                - name: 'GitLab: Liveness check was failed'
                  expression: last(/gitlab.cloud.gcm/gitlab.liveness)=0
              tags:
                - tag: scope
                  value: availability
        - name: 'GitLab: User CAPTCHA logins, total'
          type: DEPENDENT
          key: gitlab.successful_login_captcha_total
          history: 7d
          description: 'Counter of successful CAPTCHA attempts during login.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.name=="successful_login_captcha_total")].value.first()'
              error_handler: DISCARD_VALUE
          master_item:
            key: gitlab.get_metrics
          tags:
            - tag: component
              value: sessions
        - name: 'GitLab: Transactions per second'
          type: DEPENDENT
          key: gitlab.transactions.rate
          history: 7d
          value_type: FLOAT
          units: rps
          description: 'Transactions per second (gitlab_transaction_* metrics).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.name=~"gitlab_transaction_.*_count_total")].value.sum()'
              error_handler: DISCARD_VALUE
            - type: CHANGE_PER_SECOND
          master_item:
            key: gitlab.get_metrics
          tags:
            - tag: component
              value: transactions
        - name: 'GitLab: Upload file does not exist'
          type: DEPENDENT
          key: gitlab.upload_file_does_not_exist
          history: 7d
          description: 'Number of times an upload record could not find its file.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.name=="upload_file_does_not_exist")].value.first()'
              error_handler: DISCARD_VALUE
          master_item:
            key: gitlab.get_metrics
          tags:
            - tag: component
              value: application
        - name: 'GitLab: User logins, total'
          type: DEPENDENT
          key: gitlab.user_session_logins_total
          history: 7d
          description: 'Counter of how many users have logged in since GitLab was started or restarted.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.name=="user_session_logins_total")].value.first()'
              error_handler: DISCARD_VALUE
          master_item:
            key: gitlab.get_metrics
          tags:
            - tag: component
              value: sessions
        - name: 'Maximum number of open file descriptors'
          key: kernel.maxfiles
          delay: 1h
          history: 7d
          description: 'It could be increased by using sysctrl utility or modifying file /etc/sysctl.conf.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          interface_ref: if1
          tags:
            - tag: Application
              value: General
          triggers:
            - expression: 'last(/gitlab.cloud.gcm/kernel.maxfiles)<{$KERNEL.MAXFILES.MIN}'
              name: 'Configured max number of open filedescriptors is too low (< {$KERNEL.MAXFILES.MIN})'
              priority: INFO
        - name: 'Maximum number of processes'
          key: kernel.maxproc
          delay: 1h
          history: 7d
          description: 'It could be increased by using sysctrl utility or modifying file /etc/sysctl.conf.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          interface_ref: if1
          tags:
            - tag: Application
              value: General
          triggers:
            - expression: 'last(/gitlab.cloud.gcm/kernel.maxproc)<{$KERNEL.MAXPROC.MIN}'
              name: 'Configured max number of processes is too low (< {$KERNEL.MAXPROC.MIN})'
              priority: INFO
              dependencies:
                - name: 'Getting closer to process limit (over 80% used)'
                  expression: 'last(/gitlab.cloud.gcm/proc.num)/last(/gitlab.cloud.gcm/kernel.maxproc)*100>80'
        - name: 'Number of processes'
          key: proc.num
          history: 7d
          interface_ref: if1
          tags:
            - tag: Application
              value: General
        - name: 'Number of running processes'
          key: 'proc.num[,,run]'
          history: 7d
          interface_ref: if1
          tags:
            - tag: Application
              value: General
        - name: 'System boot time'
          key: system.boottime
          delay: 15m
          history: 7d
          units: unixtime
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          interface_ref: if1
          tags:
            - tag: Application
              value: General
        - name: 'Interrupts per second'
          key: system.cpu.intr
          history: 7d
          value_type: FLOAT
          preprocessing:
            - type: CHANGE_PER_SECOND
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'Load average (1m avg)'
          key: 'system.cpu.load[all,avg1]'
          history: 7d
          value_type: FLOAT
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'Load average (5m avg)'
          key: 'system.cpu.load[all,avg5]'
          history: 7d
          value_type: FLOAT
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'Load average (15m avg)'
          key: 'system.cpu.load[all,avg15]'
          history: 7d
          value_type: FLOAT
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'Number of CPUs'
          key: system.cpu.num
          history: 7d
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'Context switches per second'
          key: system.cpu.switches
          history: 7d
          value_type: FLOAT
          preprocessing:
            - type: CHANGE_PER_SECOND
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU utilization'
          type: DEPENDENT
          key: system.cpu.util
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'CPU utilization in %'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  //Calculate utilization
                  return (100 - value)
          master_item:
            key: 'system.cpu.util[,idle]'
          tags:
            - tag: Application
              value: CPU
          triggers:
            - expression: 'min(/gitlab.cloud.gcm/system.cpu.util,5m)>{$CPU.UTIL.CRIT}'
              name: 'High CPU utilization (over {$CPU.UTIL.CRIT}% for 5m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'CPU utilization is too high. The system might be slow to respond.'
              dependencies:
                - name: 'Load average is too high (per CPU load over {$LOAD_AVG_PER_CPU.MAX.WARN} for 5m)'
                  expression: |
                    min(/gitlab.cloud.gcm/system.cpu.load[all,avg1],5m)/last(/gitlab.cloud.gcm/system.cpu.num)>{$LOAD_AVG_PER_CPU.MAX.WARN}
                    and last(/gitlab.cloud.gcm/system.cpu.load[all,avg5])>0
                    and last(/gitlab.cloud.gcm/system.cpu.load[all,avg15])>0
        - name: 'CPU guest time'
          key: 'system.cpu.util[,guest]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'Guest  time (time  spent  running  a  virtual  CPU  for  a  guest  operating  system)'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU guest nice time'
          key: 'system.cpu.util[,guest_nice]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'Time spent running a niced guest (virtual CPU for guest operating systems under the control of the Linux kernel)'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU idle time'
          key: 'system.cpu.util[,idle]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The time the CPU has spent doing nothing.'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU interrupt time'
          key: 'system.cpu.util[,interrupt]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The amount of time the CPU has been servicing hardware interrupts.'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU iowait time'
          key: 'system.cpu.util[,iowait]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'Amount of time the CPU has been waiting for I/O to complete.'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU nice time'
          key: 'system.cpu.util[,nice]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The time the CPU has spent running users'' processes that have been niced.'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU softirq time'
          key: 'system.cpu.util[,softirq]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The amount of time the CPU has been servicing software interrupts.'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU steal time'
          key: 'system.cpu.util[,steal]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The amount of CPU ''stolen'' from this virtual machine by the hypervisor for other tasks (such as running another virtual machine).'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU system time'
          key: 'system.cpu.util[,system]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The time the CPU has spent running the kernel and its processes.'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU user time'
          key: 'system.cpu.util[,user]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The time the CPU has spent running users'' processes that are not niced.'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'System name'
          key: system.hostname
          delay: 1h
          history: 2w
          value_type: CHAR
          description: 'System host name.'
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          interface_ref: if1
          tags:
            - tag: Application
              value: General
          triggers:
            - expression: '(last(/gitlab.cloud.gcm/system.hostname,#1)<>last(/gitlab.cloud.gcm/system.hostname,#2))=1 and length(last(/gitlab.cloud.gcm/system.hostname))>0'
              name: 'System name has changed (new name: {ITEM.VALUE})'
              priority: INFO
              description: 'System name has changed. Ack to close.'
              manual_close: 'YES'
        - name: 'System local time'
          key: system.localtime
          history: 7d
          units: unixtime
          description: 'System local time of the host.'
          interface_ref: if1
          tags:
            - tag: Application
              value: General
          triggers:
            - expression: 'fuzzytime(/gitlab.cloud.gcm/system.localtime,{$SYSTEM.FUZZYTIME.MAX})=0'
              name: 'System time is out of sync (diff with Zabbix server > {$SYSTEM.FUZZYTIME.MAX}s)'
              priority: WARNING
              description: 'The host system time is different from the Zabbix server time.'
              manual_close: 'YES'
        - name: 'Operating system architecture'
          key: system.sw.arch
          delay: 1h
          history: 2w
          value_type: CHAR
          description: 'Operating system architecture of the host.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          interface_ref: if1
          tags:
            - tag: Application
              value: Inventory
        - name: 'Operating system'
          key: system.sw.os
          delay: 1h
          history: 2w
          value_type: CHAR
          inventory_link: OS
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          interface_ref: if1
          tags:
            - tag: Application
              value: Inventory
          triggers:
            - expression: '(last(/gitlab.cloud.gcm/system.sw.os,#1)<>last(/gitlab.cloud.gcm/system.sw.os,#2))=1 and length(last(/gitlab.cloud.gcm/system.sw.os))>0'
              name: 'Operating system description has changed'
              priority: INFO
              description: 'Operating system description has changed. Possible reasons that system has been updated or replaced. Ack to close.'
              manual_close: 'YES'
              dependencies:
                - name: 'System name has changed (new name: {ITEM.VALUE})'
                  expression: '(last(/gitlab.cloud.gcm/system.hostname,#1)<>last(/gitlab.cloud.gcm/system.hostname,#2))=1 and length(last(/gitlab.cloud.gcm/system.hostname))>0'
        - name: 'Software installed'
          key: system.sw.packages
          delay: 1h
          history: 2w
          value_type: TEXT
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          interface_ref: if1
          tags:
            - tag: Application
              value: Inventory
        - name: 'Free swap space'
          key: 'system.swap.size[,free]'
          history: 7d
          units: B
          description: 'The free space of swap volume/file in bytes.'
          interface_ref: if1
          tags:
            - tag: Application
              value: Memory
        - name: 'Free swap space in %'
          key: 'system.swap.size[,pfree]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The free space of swap volume/file in percent.'
          interface_ref: if1
          tags:
            - tag: Application
              value: Memory
        - name: 'Total swap space'
          key: 'system.swap.size[,total]'
          history: 7d
          units: B
          description: 'The total space of swap volume/file in bytes.'
          interface_ref: if1
          tags:
            - tag: Application
              value: Memory
        - name: 'System description'
          key: system.uname
          delay: 1h
          history: 2w
          value_type: CHAR
          description: 'The information as normally returned by ''uname -a''.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          interface_ref: if1
          tags:
            - tag: Application
              value: General
        - name: 'System uptime'
          key: system.uptime
          delay: 30s
          history: 2w
          trends: 0d
          units: uptime
          description: 'System uptime in ''N days, hh:mm:ss'' format.'
          interface_ref: if1
          tags:
            - tag: Application
              value: Status
          triggers:
            - expression: last(/gitlab.cloud.gcm/system.uptime)<10m
              name: '{HOST.NAME} has been restarted (uptime < 10m)'
              priority: WARNING
              description: 'The host uptime is less than 10 minutes'
              manual_close: 'YES'
        - name: 'Number of logged in users'
          key: system.users.num
          history: 7d
          description: 'Number of users who are currently logged in.'
          interface_ref: if1
          tags:
            - tag: Application
              value: General
        - name: 'Checksum of /etc/passwd'
          key: 'vfs.file.cksum[/etc/passwd]'
          delay: 15m
          history: 7d
          value_type: CHAR
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          interface_ref: if1
          tags:
            - tag: Application
              value: Security
          triggers:
            - expression: '(last(/gitlab.cloud.gcm/vfs.file.cksum[/etc/passwd],#1)<>last(/gitlab.cloud.gcm/vfs.file.cksum[/etc/passwd],#2))>0'
              name: '/etc/passwd has been changed'
              priority: INFO
              manual_close: 'YES'
              dependencies:
                - name: 'Operating system description has changed'
                  expression: '(last(/gitlab.cloud.gcm/system.sw.os,#1)<>last(/gitlab.cloud.gcm/system.sw.os,#2))=1 and length(last(/gitlab.cloud.gcm/system.sw.os))>0'
                - name: 'System name has changed (new name: {ITEM.VALUE})'
                  expression: '(last(/gitlab.cloud.gcm/system.hostname,#1)<>last(/gitlab.cloud.gcm/system.hostname,#2))=1 and length(last(/gitlab.cloud.gcm/system.hostname))>0'
        - name: 'Available memory'
          key: 'vm.memory.size[available]'
          history: 7d
          units: B
          description: 'Available memory, in Linux, available = free + buffers + cache. On other platforms calculation may vary. See also: https://www.zabbix.com/documentation/5.0/manual/appendix/items/vm.memory.size_params'
          interface_ref: if1
          tags:
            - tag: Application
              value: Memory
        - name: 'Available memory in %'
          key: 'vm.memory.size[pavailable]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'Available memory as percentage of total. See also: https://www.zabbix.com/documentation/5.0/manual/appendix/items/vm.memory.size_params'
          interface_ref: if1
          tags:
            - tag: Application
              value: Memory
        - name: 'Total memory'
          key: 'vm.memory.size[total]'
          history: 7d
          units: B
          description: 'Total memory in Bytes'
          interface_ref: if1
          tags:
            - tag: Application
              value: Memory
        - name: 'Memory utilization'
          type: DEPENDENT
          key: vm.memory.utilization
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'Memory used percentage is calculated as (100-pavailable)'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return (100-value);'
          master_item:
            key: 'vm.memory.size[pavailable]'
          tags:
            - tag: Application
              value: Memory
          triggers:
            - expression: 'min(/gitlab.cloud.gcm/vm.memory.utilization,5m)>{$MEMORY.UTIL.MAX}'
              name: 'High memory utilization (>{$MEMORY.UTIL.MAX}% for 5m)'
              priority: AVERAGE
              description: 'The system is running out of free memory.'
              dependencies:
                - name: 'Lack of available memory (< {$MEMORY.AVAILABLE.MIN} of {ITEM.VALUE2})'
                  expression: 'min(/gitlab.cloud.gcm/vm.memory.size[available],5m)<{$MEMORY.AVAILABLE.MIN} and last(/gitlab.cloud.gcm/vm.memory.size[total])>0'
        - name: 'Zabbix agent availability'
          type: INTERNAL
          key: 'zabbix[host,agent,available]'
          history: 7d
          description: 'Monitoring agent availability status'
          tags:
            - tag: Application
              value: Status
          triggers:
            - expression: 'max(/gitlab.cloud.gcm/zabbix[host,agent,available],{$AGENT.TIMEOUT})=0'
              name: 'Zabbix agent is not available (for {$AGENT.TIMEOUT})'
              priority: AVERAGE
              description: 'For passive only agents, host availability is used with {$AGENT.TIMEOUT} as time threshold.'
              manual_close: 'YES'
      discovery_rules:
        - name: 'Containers discovery'
          key: 'docker.containers.discovery[false]'
          delay: 15m
          filter:
            evaltype: AND
            conditions:
              - macro: '{#NAME}'
                value: '{$DOCKER.LLD.FILTER.CONTAINER.MATCHES}'
              - macro: '{#NAME}'
                value: '{$DOCKER.LLD.FILTER.CONTAINER.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: |
            Discovery for containers metrics
            
            Parameter:
            true  - Returns all containers
            false - Returns only running containers
          interface_ref: if1
          item_prototypes:
            - name: 'Container {#NAME}: Created'
              type: DEPENDENT
              key: 'docker.container_info.created["{#NAME}"]'
              history: 7d
              units: unixtime
