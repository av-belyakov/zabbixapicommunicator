          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.Name
          master_item:
            key: docker.info
          tags:
            - tag: component
              value: system
          triggers:
            - expression: 'nodata(/es-siem-db/docker.name,30m)=1'
              name: 'Docker: Failed to fetch info data (or no data for 30m)'
              priority: WARNING
              description: 'Zabbix has not received data for items for the last 30 minutes'
              manual_close: 'YES'
              dependencies:
                - name: 'Docker: Service is down'
                  expression: last(/es-siem-db/docker.ping)=0
              tags:
                - tag: scope
                  value: availability
        - name: 'Docker: NCPU'
          type: DEPENDENT
          key: docker.ncpu
          history: 7d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.NCPU
          master_item:
            key: docker.info
          tags:
            - tag: component
              value: cpu
        - name: 'Docker: NEvents listener'
          type: DEPENDENT
          key: docker.nevents_listener
          history: 7d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.NEventsListener
          master_item:
            key: docker.info
          tags:
            - tag: component
              value: application
        - name: 'Docker: Nfd'
          type: DEPENDENT
          key: docker.nfd
          history: 7d
          description: 'Number of used File Descriptors'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.NFd
          master_item:
            key: docker.info
          tags:
            - tag: component
              value: os
        - name: 'Docker: OomKill disabled'
          type: DEPENDENT
          key: docker.oomkill.disabled
          history: 7d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.OomKillDisable
            - type: BOOL_TO_DECIMAL
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: docker.info
          tags:
            - tag: component
              value: system
        - name: 'Docker: Operating system'
          type: DEPENDENT
          key: docker.operating_system
          history: 7d
          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.OperatingSystem
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: docker.info
          tags:
            - tag: component
              value: os
        - name: 'Docker: OS type'
          type: DEPENDENT
          key: docker.os_type
          history: 7d
          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.OSType
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: docker.info
          tags:
            - tag: component
              value: os
        - name: 'Docker: Pids limit enabled'
          type: DEPENDENT
          key: docker.pids_limit.enabled
          history: 7d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.PidsLimit
            - type: BOOL_TO_DECIMAL
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: docker.info
          tags:
            - tag: component
              value: system
        - name: 'Docker: Ping'
          key: docker.ping
          history: 7h
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 10m
          interface_ref: if1
          tags:
            - tag: component
              value: application
            - tag: component
              value: health
          triggers:
            - expression: last(/es-siem-db/docker.ping)=0
              name: 'Docker: Service is down'
              priority: AVERAGE
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - name: 'Docker: Docker root dir'
          type: DEPENDENT
          key: docker.root_dir
          history: 7d
          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.DockerRootDir
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: docker.info
          tags:
            - tag: component
              value: system
        - name: 'Docker: Server version'
          type: DEPENDENT
          key: docker.server_version
          history: 7d
          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ServerVersion
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: docker.info
          tags:
            - tag: component
              value: application
          triggers:
            - expression: 'last(/es-siem-db/docker.server_version,#1)<>last(/es-siem-db/docker.server_version,#2) and length(last(/es-siem-db/docker.server_version))>0'
              name: 'Docker: Version has changed (new version: {ITEM.VALUE})'
              priority: INFO
              description: 'Docker version has changed. Ack to close.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - name: 'Docker: Swap limit enabled'
          type: DEPENDENT
          key: docker.swap_limit.enabled
          history: 7d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.SwapLimit
            - type: BOOL_TO_DECIMAL
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: docker.info
          tags:
            - tag: component
              value: memory
            - tag: component
              value: storage
        - name: 'Docker: Volumes size'
          type: DEPENDENT
          key: docker.volumes_size
          history: 7d
          units: B
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.Volumes[*].UsageData.Size.sum()'
          master_item:
            key: docker.data_usage
          tags:
            - tag: component
              value: storage
        - name: 'ES: Delayed unassigned shards'
          type: DEPENDENT
          key: es.cluster.delayed_unassigned_shards
          history: 7d
          description: 'The number of shards whose allocation has been delayed by the timeout settings.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.delayed_unassigned_shards
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: Application
              value: 'ES cluster'
        - name: 'ES: Get cluster health'
          type: HTTP_AGENT
          key: es.cluster.get_health
          history: 0h
          value_type: TEXT
          authtype: BASIC
          username: '{$ELASTICSEARCH.USERNAME}'
          password: '{$ELASTICSEARCH.PASSWORD}'
          description: 'Returns the health status of a cluster.'
          timeout: 15s
          url: '{$ELASTICSEARCH.SCHEME}://{HOST.CONN}:{$ELASTICSEARCH.PORT}/_cluster/health?timeout=5s'
          status_codes: ''
          tags:
            - tag: Application
              value: 'Zabbix raw items'
        - name: 'ES: Get cluster stats'
          type: HTTP_AGENT
          key: es.cluster.get_stats
          history: 0h
          value_type: TEXT
          authtype: BASIC
          username: '{$ELASTICSEARCH.USERNAME}'
          password: '{$ELASTICSEARCH.PASSWORD}'
          description: 'Returns cluster statistics.'
          timeout: 15s
          url: '{$ELASTICSEARCH.SCHEME}://{HOST.CONN}:{$ELASTICSEARCH.PORT}/_cluster/stats'
          tags:
            - tag: Application
              value: 'Zabbix raw items'
        - name: 'ES: Inactive shards percentage'
          type: DEPENDENT
          key: es.cluster.inactive_shards_percent_as_number
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The ratio of inactive shards in the cluster expressed as a percentage.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.active_shards_percent_as_number
            - type: JAVASCRIPT
              parameters:
                - 'return (100 - value)'
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: Application
              value: 'ES cluster'
        - name: 'ES: Number of initializing shards'
          type: DEPENDENT
          key: es.cluster.initializing_shards
          history: 7d
          description: 'The number of shards that are under initialization.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.initializing_shards
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: Application
              value: 'ES cluster'
          triggers:
            - expression: 'min(/es-siem-db/es.cluster.initializing_shards,10m)>0'
              name: 'ES: Cluster has the initializing shards'
              priority: AVERAGE
              description: 'The cluster has the initializing shards longer than 10 minutes.'
              manual_close: 'YES'
        - name: 'ES: Number of data nodes'
          type: DEPENDENT
          key: es.cluster.number_of_data_nodes
          history: 7d
          description: 'The number of nodes that are dedicated to data nodes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.number_of_data_nodes
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: Application
              value: 'ES cluster'
        - name: 'ES: Number of nodes'
          type: DEPENDENT
          key: es.cluster.number_of_nodes
          history: 7d
          description: 'The number of nodes within the cluster.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.number_of_nodes
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: Application
              value: 'ES cluster'
          triggers:
            - expression: change(/es-siem-db/es.cluster.number_of_nodes)<0
              name: 'ES: The number of nodes within the cluster has decreased'
              priority: INFO
              manual_close: 'YES'
            - expression: change(/es-siem-db/es.cluster.number_of_nodes)>0
              name: 'ES: The number of nodes within the cluster has increased'
              priority: INFO
              manual_close: 'YES'
        - name: 'ES: Number of pending tasks'
          type: DEPENDENT
          key: es.cluster.number_of_pending_tasks
          history: 7d
          description: 'The number of cluster-level changes that have not yet been executed.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.number_of_pending_tasks
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: Application
              value: 'ES cluster'
        - name: 'ES: Number of relocating shards'
          type: DEPENDENT
          key: es.cluster.relocating_shards
          history: 7d
          description: 'The number of shards that are under relocation.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.relocating_shards
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: Application
              value: 'ES cluster'
        - name: 'ES: Cluster health status'
          type: DEPENDENT
          key: es.cluster.status
          history: 7d
          description: |
            Health status of the cluster, based on the state of its primary and replica shards. Statuses are:
            green
            All shards are assigned.
            yellow
            All primary shards are assigned, but one or more replica shards are unassigned. If a node in the cluster fails, some data could be unavailable until that node is repaired.
            red
            One or more primary shards are unassigned, so some data is unavailable. This can occur briefly during cluster startup as primary shards are assigned.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status
            - type: JAVASCRIPT
              parameters:
                - |
                  var state = ['green', 'yellow', 'red'];
                  
                  return state.indexOf(value.trim()) === -1 ? 255 : state.indexOf(value.trim());
                  
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: Application
              value: 'ES cluster'
          triggers:
            - expression: last(/es-siem-db/es.cluster.status)=2
              name: 'ES: Health is RED'
              priority: HIGH
              description: |
                One or more primary shards are unassigned, so some data is unavailable. 
                This can occur briefly during cluster startup as primary shards are assigned.
              manual_close: 'YES'
            - expression: last(/es-siem-db/es.cluster.status)=255
              name: 'ES: Health is UNKNOWN'
              priority: HIGH
              description: 'The health status of the cluster is unknown or cannot be obtained.'
              manual_close: 'YES'
            - expression: last(/es-siem-db/es.cluster.status)=1
              name: 'ES: Health is YELLOW'
              priority: AVERAGE
              description: |
                All primary shards are assigned, but one or more replica shards are unassigned. 
                If a node in the cluster fails, some data could be unavailable until that node is repaired.
              manual_close: 'YES'
        - name: 'ES: Task max waiting in queue'
          type: DEPENDENT
          key: es.cluster.task_max_waiting_in_queue
          history: 7d
          value_type: FLOAT
          units: s
          description: 'The time expressed in seconds since the earliest initiated task is waiting for being performed.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.task_max_waiting_in_queue_millis
            - type: MULTIPLIER
              parameters:
                - '0.001'
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: Application
              value: 'ES cluster'
        - name: 'ES: Number of unassigned shards'
          type: DEPENDENT
          key: es.cluster.unassigned_shards
          history: 7d
          description: 'The number of shards that are not allocated.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.unassigned_shards
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: Application
              value: 'ES cluster'
          triggers:
            - expression: 'min(/es-siem-db/es.cluster.unassigned_shards,10m)>0'
              name: 'ES: Cluster has the unassigned shards'
              priority: AVERAGE
              description: 'The cluster has the unassigned shards longer than 10 minutes.'
              manual_close: 'YES'
        - name: 'ES: Indices with shards assigned to nodes'
          type: DEPENDENT
          key: es.indices.count
          history: 7d
          description: 'The total number of indices with shards assigned to the selected nodes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.indices.count
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: es.cluster.get_stats
          tags:
            - tag: Application
              value: 'ES cluster'
        - name: 'ES: Number of non-deleted documents'
          type: DEPENDENT
          key: es.indices.docs.count
          history: 7d
          description: |
            The total number of non-deleted documents across all primary shards assigned to the selected nodes.
            This number is based on the documents in Lucene segments and may include the documents from nested fields.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.indices.docs.count
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: es.cluster.get_stats
          tags:
            - tag: Application
              value: 'ES cluster'
        - name: 'ES: Nodes with the data role'
          type: DEPENDENT
          key: es.nodes.count.data
          history: 7d
          description: 'The number of selected nodes with the data role.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nodes.count.data
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: es.cluster.get_stats
          tags:
            - tag: Application
              value: 'ES cluster'
        - name: 'ES: Nodes with the ingest role'
          type: DEPENDENT
          key: es.nodes.count.ingest
          history: 7d
          description: 'The number of selected nodes with the ingest role.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nodes.count.ingest
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: es.cluster.get_stats
          tags:
            - tag: Application
              value: 'ES cluster'
        - name: 'ES: Nodes with the master role'
          type: DEPENDENT
          key: es.nodes.count.master
          history: 7d
          description: 'The number of selected nodes with the master role.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nodes.count.master
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: es.cluster.get_stats
          tags:
            - tag: Application
              value: 'ES cluster'
          triggers:
            - expression: last(/es-siem-db/es.nodes.count.master)=2
              name: 'ES: Cluster has only two master nodes'
              priority: DISASTER
              description: 'The cluster has only two nodes with a master role and will be unavailable if one of them breaks.'
              manual_close: 'YES'
        - name: 'ES: Total available size to JVM in all file stores'
          type: DEPENDENT
          key: es.nodes.fs.available_in_bytes
          history: 7d
          units: B
          description: |
            The total number of bytes available to JVM in the file stores across all selected nodes.
            Depending on OS or process-level restrictions, this number may be less than nodes.fs.free_in_byes. 
            This is the actual amount of free disk space the selected Elasticsearch nodes can use.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nodes.fs.available_in_bytes
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: es.cluster.get_stats
          tags:
            - tag: Application
              value: 'ES cluster'
        - name: 'ES: Total size of all file stores'
          type: DEPENDENT
          key: es.nodes.fs.total_in_bytes
          history: 7d
          units: B
          description: 'The total size in bytes of all file stores across all selected nodes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nodes.fs.total_in_bytes
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: es.cluster.get_stats
          tags:
            - tag: Application
              value: 'ES cluster'
        - name: 'ES: Get nodes stats'
          type: HTTP_AGENT
          key: es.nodes.get_stats
          history: 0h
          value_type: TEXT
          authtype: BASIC
          username: '{$ELASTICSEARCH.USERNAME}'
          password: '{$ELASTICSEARCH.PASSWORD}'
          description: 'Returns cluster nodes statistics.'
          timeout: 30s
          url: '{$ELASTICSEARCH.SCHEME}://{HOST.CONN}:{$ELASTICSEARCH.PORT}/_nodes/stats'
          tags:
            - tag: Application
              value: 'Zabbix raw items'
        - name: 'ES: Cluster uptime'
          type: DEPENDENT
          key: 'es.nodes.jvm.max_uptime[{#ES.NODE}]'
          history: 7d
          value_type: FLOAT
          units: s
          description: 'Uptime duration in seconds since JVM has last started.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nodes.jvm.max_uptime_in_millis
            - type: MULTIPLIER
              parameters:
                - '0.001'
          master_item:
            key: es.cluster.get_stats
          tags:
            - tag: Application
              value: 'ES cluster'
          triggers:
            - expression: 'last(/es-siem-db/es.nodes.jvm.max_uptime[{#ES.NODE}])<10m'
              name: 'ES: Cluster has been restarted (uptime < 10m)'
              priority: INFO
              description: 'Uptime is less than 10 minutes'
              manual_close: 'YES'
        - name: 'Maximum number of open file descriptors'
          key: kernel.maxfiles
          delay: 1h
          history: 7d
          description: 'It could be increased by using sysctrl utility or modifying file /etc/sysctl.conf.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          interface_ref: if1
          tags:
            - tag: Application
              value: General
          triggers:
            - expression: 'last(/es-siem-db/kernel.maxfiles)<{$KERNEL.MAXFILES.MIN}'
              name: 'Configured max number of open filedescriptors is too low (< {$KERNEL.MAXFILES.MIN})'
              priority: INFO
        - name: 'Maximum number of processes'
          key: kernel.maxproc
          delay: 1h
          history: 7d
          description: 'It could be increased by using sysctrl utility or modifying file /etc/sysctl.conf.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          interface_ref: if1
          tags:
            - tag: Application
              value: General
          triggers:
            - expression: 'last(/es-siem-db/kernel.maxproc)<{$KERNEL.MAXPROC.MIN}'
              name: 'Configured max number of processes is too low (< {$KERNEL.MAXPROC.MIN})'
              priority: INFO
              dependencies:
                - name: 'Getting closer to process limit (over 80% used)'
                  expression: 'last(/es-siem-db/proc.num)/last(/es-siem-db/kernel.maxproc)*100>80'
        - name: 'ES: Service response time'
          type: SIMPLE
          key: 'net.tcp.service.perf["{$ELASTICSEARCH.SCHEME}","{HOST.CONN}","{$ELASTICSEARCH.PORT}"]'
          history: 7d
          value_type: FLOAT
          units: s
          description: 'Checks performance of the TCP service.'
          interface_ref: if1
          tags:
            - tag: Application
              value: 'ES cluster'
          triggers:
            - expression: 'min(/es-siem-db/net.tcp.service.perf["{$ELASTICSEARCH.SCHEME}","{HOST.CONN}","{$ELASTICSEARCH.PORT}"],5m)>{$ELASTICSEARCH.RESPONSE_TIME.MAX.WARN}'
              name: 'ES: Service response time is too high (over {$ELASTICSEARCH.RESPONSE_TIME.MAX.WARN} for 5m)'
              priority: WARNING
              description: 'The performance of the TCP service is very low.'
              manual_close: 'YES'
              dependencies:
                - name: 'ES: Service is down'
                  expression: 'last(/es-siem-db/net.tcp.service["{$ELASTICSEARCH.SCHEME}","{HOST.CONN}","{$ELASTICSEARCH.PORT}"])=0'
        - name: 'ES: Service status'
          type: SIMPLE
          key: 'net.tcp.service["{$ELASTICSEARCH.SCHEME}","{HOST.CONN}","{$ELASTICSEARCH.PORT}"]'
          history: 7d
          description: 'Checks if the service is running and accepting TCP connections.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 10m
          interface_ref: if1
          tags:
            - tag: Application
              value: 'ES cluster'
          triggers:
            - expression: 'last(/es-siem-db/net.tcp.service["{$ELASTICSEARCH.SCHEME}","{HOST.CONN}","{$ELASTICSEARCH.PORT}"])=0'
              name: 'ES: Service is down'
              priority: AVERAGE
              description: 'The service is unavailable or does not accept TCP connections.'
              manual_close: 'YES'
        - name: 'Number of processes'
          key: proc.num
          history: 7d
          interface_ref: if1
          tags:
            - tag: Application
              value: General
        - name: 'Number of running processes'
          key: 'proc.num[,,run]'
          history: 7d
          interface_ref: if1
          tags:
            - tag: Application
              value: General
        - name: 'System boot time'
          key: system.boottime
          delay: 15m
          history: 7d
          units: unixtime
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          interface_ref: if1
          tags:
            - tag: Application
              value: General
        - name: 'Interrupts per second'
          key: system.cpu.intr
          history: 7d
          value_type: FLOAT
          preprocessing:
            - type: CHANGE_PER_SECOND
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'Load average (1m avg)'
          key: 'system.cpu.load[all,avg1]'
          history: 7d
          value_type: FLOAT
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'Load average (5m avg)'
          key: 'system.cpu.load[all,avg5]'
          history: 7d
          value_type: FLOAT
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'Load average (15m avg)'
          key: 'system.cpu.load[all,avg15]'
          history: 7d
          value_type: FLOAT
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'Number of CPUs'
          key: system.cpu.num
          history: 7d
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'Context switches per second'
          key: system.cpu.switches
          history: 7d
          value_type: FLOAT
          preprocessing:
            - type: CHANGE_PER_SECOND
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU utilization'
          type: DEPENDENT
          key: system.cpu.util
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'CPU utilization in %'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  //Calculate utilization
                  return (100 - value)
          master_item:
            key: 'system.cpu.util[,idle]'
          tags:
            - tag: Application
              value: CPU
          triggers:
            - expression: 'min(/es-siem-db/system.cpu.util,5m)>{$CPU.UTIL.CRIT}'
              name: 'High CPU utilization (over {$CPU.UTIL.CRIT}% for 5m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'CPU utilization is too high. The system might be slow to respond.'
              dependencies:
                - name: 'Load average is too high (per CPU load over {$LOAD_AVG_PER_CPU.MAX.WARN} for 5m)'
                  expression: |
                    min(/es-siem-db/system.cpu.load[all,avg1],5m)/last(/es-siem-db/system.cpu.num)>{$LOAD_AVG_PER_CPU.MAX.WARN}
                    and last(/es-siem-db/system.cpu.load[all,avg5])>0
                    and last(/es-siem-db/system.cpu.load[all,avg15])>0
        - name: 'CPU guest time'
          key: 'system.cpu.util[,guest]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'Guest  time (time  spent  running  a  virtual  CPU  for  a  guest  operating  system)'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU guest nice time'
          key: 'system.cpu.util[,guest_nice]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'Time spent running a niced guest (virtual CPU for guest operating systems under the control of the Linux kernel)'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU idle time'
          key: 'system.cpu.util[,idle]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The time the CPU has spent doing nothing.'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU interrupt time'
          key: 'system.cpu.util[,interrupt]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The amount of time the CPU has been servicing hardware interrupts.'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU iowait time'
          key: 'system.cpu.util[,iowait]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'Amount of time the CPU has been waiting for I/O to complete.'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU nice time'
          key: 'system.cpu.util[,nice]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The time the CPU has spent running users'' processes that have been niced.'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU softirq time'
          key: 'system.cpu.util[,softirq]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The amount of time the CPU has been servicing software interrupts.'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU steal time'
          key: 'system.cpu.util[,steal]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The amount of CPU ''stolen'' from this virtual machine by the hypervisor for other tasks (such as running another virtual machine).'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU system time'
          key: 'system.cpu.util[,system]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The time the CPU has spent running the kernel and its processes.'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'CPU user time'
          key: 'system.cpu.util[,user]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The time the CPU has spent running users'' processes that are not niced.'
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'System name'
          key: system.hostname
          delay: 1h
          history: 2w
          value_type: CHAR
          description: 'System host name.'
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          interface_ref: if1
          tags:
            - tag: Application
              value: General
          triggers:
            - expression: '(last(/es-siem-db/system.hostname,#1)<>last(/es-siem-db/system.hostname,#2))=1 and length(last(/es-siem-db/system.hostname))>0'
              name: 'System name has changed (new name: {ITEM.VALUE})'
              priority: INFO
              description: 'System name has changed. Ack to close.'
              manual_close: 'YES'
        - name: 'System local time'
          key: system.localtime
          history: 7d
          units: unixtime
          description: 'System local time of the host.'
          interface_ref: if1
          tags:
            - tag: Application
              value: General
          triggers:
            - expression: 'fuzzytime(/es-siem-db/system.localtime,{$SYSTEM.FUZZYTIME.MAX})=0'
              name: 'System time is out of sync (diff with Zabbix server > {$SYSTEM.FUZZYTIME.MAX}s)'
              priority: WARNING
              description: 'The host system time is different from the Zabbix server time.'
              manual_close: 'YES'
        - name: 'Operating system architecture'
          key: system.sw.arch
          delay: 1h
          history: 2w
          value_type: CHAR
          description: 'Operating system architecture of the host.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          interface_ref: if1
          tags:
            - tag: Application
              value: Inventory
        - name: 'Operating system'
          key: system.sw.os
          delay: 1h
          history: 2w
          value_type: CHAR
          inventory_link: OS
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          interface_ref: if1
          tags:
            - tag: Application
              value: Inventory
          triggers:
            - expression: '(last(/es-siem-db/system.sw.os,#1)<>last(/es-siem-db/system.sw.os,#2))=1 and length(last(/es-siem-db/system.sw.os))>0'
              name: 'Operating system description has changed'
              priority: INFO
              description: 'Operating system description has changed. Possible reasons that system has been updated or replaced. Ack to close.'
              manual_close: 'YES'
              dependencies:
                - name: 'System name has changed (new name: {ITEM.VALUE})'
                  expression: '(last(/es-siem-db/system.hostname,#1)<>last(/es-siem-db/system.hostname,#2))=1 and length(last(/es-siem-db/system.hostname))>0'
        - name: 'Software installed'
          key: system.sw.packages
          delay: 1h
          history: 2w
          value_type: TEXT
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          interface_ref: if1
          tags:
            - tag: Application
              value: Inventory
        - name: 'Free swap space'
          key: 'system.swap.size[,free]'
          history: 7d
          units: B
          description: 'The free space of swap volume/file in bytes.'
          interface_ref: if1
          tags:
            - tag: Application
              value: Memory
        - name: 'Free swap space in %'
          key: 'system.swap.size[,pfree]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The free space of swap volume/file in percent.'
          interface_ref: if1
          tags:
            - tag: Application
              value: Memory
        - name: 'Total swap space'
          key: 'system.swap.size[,total]'
          history: 7d
          units: B
          description: 'The total space of swap volume/file in bytes.'
          interface_ref: if1
          tags:
            - tag: Application
              value: Memory
        - name: 'System description'
          key: system.uname
          delay: 1h
          history: 2w
          value_type: CHAR
          description: 'The information as normally returned by ''uname -a''.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          interface_ref: if1
          tags:
            - tag: Application
              value: General
        - name: 'System uptime'
          key: system.uptime
          delay: 30s
          history: 2w
          trends: 0d
          units: uptime
          description: 'System uptime in ''N days, hh:mm:ss'' format.'
          interface_ref: if1
          tags:
            - tag: Application
              value: Status
          triggers:
            - expression: last(/es-siem-db/system.uptime)<10m
              name: '{HOST.NAME} has been restarted (uptime < 10m)'
              priority: WARNING
              description: 'The host uptime is less than 10 minutes'
              manual_close: 'YES'
        - name: 'Number of logged in users'
          key: system.users.num
          history: 7d
          description: 'Number of users who are currently logged in.'
          interface_ref: if1
          tags:
            - tag: Application
              value: General
        - name: 'Checksum of /etc/passwd'
          key: 'vfs.file.cksum[/etc/passwd]'
          delay: 15m
          history: 7d
          value_type: CHAR
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          interface_ref: if1
          tags:
            - tag: Application
              value: Security
          triggers:
            - expression: '(last(/es-siem-db/vfs.file.cksum[/etc/passwd],#1)<>last(/es-siem-db/vfs.file.cksum[/etc/passwd],#2))>0'
              name: '/etc/passwd has been changed'
              priority: INFO
              manual_close: 'YES'
              dependencies:
                - name: 'Operating system description has changed'
                  expression: '(last(/es-siem-db/system.sw.os,#1)<>last(/es-siem-db/system.sw.os,#2))=1 and length(last(/es-siem-db/system.sw.os))>0'
                - name: 'System name has changed (new name: {ITEM.VALUE})'
                  expression: '(last(/es-siem-db/system.hostname,#1)<>last(/es-siem-db/system.hostname,#2))=1 and length(last(/es-siem-db/system.hostname))>0'
        - name: 'Available memory'
          key: 'vm.memory.size[available]'
          history: 7d
          units: B
          description: 'Available memory, in Linux, available = free + buffers + cache. On other platforms calculation may vary. See also: https://www.zabbix.com/documentation/5.0/manual/appendix/items/vm.memory.size_params'
          interface_ref: if1
          tags:
            - tag: Application
              value: Memory
        - name: 'Available memory in %'
          key: 'vm.memory.size[pavailable]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'Available memory as percentage of total. See also: https://www.zabbix.com/documentation/5.0/manual/appendix/items/vm.memory.size_params'
          interface_ref: if1
          tags:
            - tag: Application
              value: Memory
        - name: 'Total memory'
          key: 'vm.memory.size[total]'
          history: 7d
          units: B
          description: 'Total memory in Bytes'
          interface_ref: if1
          tags:
            - tag: Application
              value: Memory
        - name: 'Memory utilization'
          type: DEPENDENT
          key: vm.memory.utilization
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'Memory used percentage is calculated as (100-pavailable)'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return (100-value);'
          master_item:
            key: 'vm.memory.size[pavailable]'
          tags:
            - tag: Application
              value: Memory
          triggers:
            - expression: 'min(/es-siem-db/vm.memory.utilization,5m)>{$MEMORY.UTIL.MAX}'
              name: 'High memory utilization (>{$MEMORY.UTIL.MAX}% for 5m)'
              priority: AVERAGE
              description: 'The system is running out of free memory.'
              dependencies:
                - name: 'Lack of available memory (< {$MEMORY.AVAILABLE.MIN} of {ITEM.VALUE2})'
                  expression: 'min(/es-siem-db/vm.memory.size[available],5m)<{$MEMORY.AVAILABLE.MIN} and last(/es-siem-db/vm.memory.size[total])>0'
        - name: 'Zabbix agent availability'
          type: INTERNAL
          key: 'zabbix[host,agent,available]'
          history: 7d
          description: 'Monitoring agent availability status'
          tags:
            - tag: Application
              value: Status
          triggers:
            - expression: 'max(/es-siem-db/zabbix[host,agent,available],{$AGENT.TIMEOUT})=0'
              name: 'Zabbix agent is not available (for {$AGENT.TIMEOUT})'
              priority: AVERAGE
              description: 'For passive only agents, host availability is used with {$AGENT.TIMEOUT} as time threshold.'
              manual_close: 'YES'
      discovery_rules:
        - name: 'Containers discovery'
          key: 'docker.containers.discovery[false]'
          delay: 15m
          filter:
            evaltype: AND
            conditions:
              - macro: '{#NAME}'
                value: '{$DOCKER.LLD.FILTER.CONTAINER.MATCHES}'
              - macro: '{#NAME}'
                value: '{$DOCKER.LLD.FILTER.CONTAINER.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: |
            Discovery for containers metrics
            
            Parameter:
            true  - Returns all containers
            false - Returns only running containers
          interface_ref: if1
          item_prototypes:
            - name: 'Container {#NAME}: Created'
              type: DEPENDENT
              key: 'docker.container_info.created["{#NAME}"]'
              history: 7d
              units: unixtime
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.Created
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'docker.container_info["{#NAME}"]'
              tags:
                - tag: component
                  value: system
                - tag: container
                  value: '{#NAME}'
            - name: 'Container {#NAME}: Finished at'
              type: DEPENDENT
              key: 'docker.container_info.finished["{#NAME}"]'
              history: 7d
              value_type: FLOAT
              units: unixtime
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.State.FinishedAt
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'docker.container_info["{#NAME}"]'
              tags:
                - tag: component
                  value: system
                - tag: container
                  value: '{#NAME}'
            - name: 'Container {#NAME}: Image'
              type: DEPENDENT
              key: 'docker.container_info.image["{#NAME}"]'
              history: 7d
              value_type: CHAR
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.Names[0] == "{#NAME}")].Image.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: docker.containers
              tags:
                - tag: component
                  value: images
                - tag: container
                  value: '{#NAME}'
            - name: 'Container {#NAME}: Restart count'
              type: DEPENDENT
              key: 'docker.container_info.restart_count["{#NAME}"]'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.RestartCount
              master_item:
                key: 'docker.container_info["{#NAME}"]'
              tags:
                - tag: component
                  value: system
                - tag: container
                  value: '{#NAME}'
            - name: 'Container {#NAME}: Started at'
              type: DEPENDENT
              key: 'docker.container_info.started["{#NAME}"]'
              history: 7d
              value_type: FLOAT
              units: unixtime
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.State.StartedAt
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'docker.container_info["{#NAME}"]'
              tags:
                - tag: component
                  value: system
                - tag: container
                  value: '{#NAME}'
            - name: 'Container {#NAME}: Dead'
              type: DEPENDENT
              key: 'docker.container_info.state.dead["{#NAME}"]'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.State.Dead
                - type: BOOL_TO_DECIMAL
              master_item:
                key: 'docker.container_info["{#NAME}"]'
              tags:
                - tag: component
                  value: system
                - tag: container
                  value: '{#NAME}'
            - name: 'Container {#NAME}: Error'
              type: DEPENDENT
              key: 'docker.container_info.state.error["{#NAME}"]'
              history: 7d
              value_type: CHAR
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.State.Error
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'docker.container_info["{#NAME}"]'
              tags:
                - tag: component
                  value: system
                - tag: container
                  value: '{#NAME}'
              trigger_prototypes:
                - expression: 'last(/es-siem-db/docker.container_info.state.error["{#NAME}"],#1)<>last(/es-siem-db/docker.container_info.state.error["{#NAME}"],#2) and length(last(/es-siem-db/docker.container_info.state.error["{#NAME}"]))>0'
                  name: 'Container {#NAME}: An error has occurred in the container'
                  priority: WARNING
                  description: 'Container {#NAME} has an error. Ack to close.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
            - name: 'Container {#NAME}: Exit code'
              type: DEPENDENT
              key: 'docker.container_info.state.exitcode["{#NAME}"]'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.State.ExitCode
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'docker.container_info["{#NAME}"]'
              tags:
                - tag: component
                  value: system
                - tag: container
                  value: '{#NAME}'
            - name: 'Container {#NAME}: OOMKilled'
              type: DEPENDENT
              key: 'docker.container_info.state.oomkilled["{#NAME}"]'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.State.OOMKilled
                - type: BOOL_TO_DECIMAL
              master_item:
                key: 'docker.container_info["{#NAME}"]'
              tags:
                - tag: component
                  value: system
                - tag: container
                  value: '{#NAME}'
            - name: 'Container {#NAME}: Paused'
              type: DEPENDENT
              key: 'docker.container_info.state.paused["{#NAME}"]'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.State.Paused
                - type: BOOL_TO_DECIMAL
              master_item:
                key: 'docker.container_info["{#NAME}"]'
              tags:
                - tag: component
                  value: system
                - tag: container
                  value: '{#NAME}'
            - name: 'Container {#NAME}: Pid'
              type: DEPENDENT
              key: 'docker.container_info.state.pid["{#NAME}"]'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.State.Pid
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'docker.container_info["{#NAME}"]'
              tags:
                - tag: component
                  value: system
                - tag: container
                  value: '{#NAME}'
            - name: 'Container {#NAME}: Restarting'
              type: DEPENDENT
              key: 'docker.container_info.state.restarting["{#NAME}"]'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.State.Restarting
                - type: BOOL_TO_DECIMAL
              master_item:
                key: 'docker.container_info["{#NAME}"]'
              tags:
                - tag: component
                  value: system
                - tag: container
                  value: '{#NAME}'
            - name: 'Container {#NAME}: Running'
              type: DEPENDENT
              key: 'docker.container_info.state.running["{#NAME}"]'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.State.Running
                - type: BOOL_TO_DECIMAL
              master_item:
                key: 'docker.container_info["{#NAME}"]'
              tags:
                - tag: component
                  value: system
                - tag: container
                  value: '{#NAME}'
            - name: 'Container {#NAME}: Status'
              type: DEPENDENT
              key: 'docker.container_info.state.status["{#NAME}"]'
              history: 7d
              value_type: CHAR
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.State.Status
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'docker.container_info["{#NAME}"]'
              tags:
                - tag: component
                  value: system
                - tag: container
                  value: '{#NAME}'
            - name: 'Container {#NAME}: Get info'
              key: 'docker.container_info["{#NAME}"]'
              history: '0'
              value_type: CHAR
              description: 'Return low-level information about a container'
              interface_ref: if1
              tags:
                - tag: component
                  value: raw
                - tag: container
                  value: '{#NAME}'
            - name: 'Container {#NAME}: CPU percent usage'
              type: DEPENDENT
              key: 'docker.container_stats.cpu_pct_usage["{#NAME}"]'
              history: 7d
              value_type: FLOAT
              units: '%'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.cpu_stats.cpu_usage.percent_usage
              master_item:
                key: 'docker.container_stats["{#NAME}"]'
              tags:
                - tag: component
                  value: cpu
                - tag: container
                  value: '{#NAME}'
            - name: 'Container {#NAME}: CPU kernelmode usage per second'
              type: DEPENDENT
              key: 'docker.container_stats.cpu_usage.kernel.rate["{#NAME}"]'
              history: 7d
              value_type: FLOAT
              units: s
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.cpu_stats.cpu_usage.usage_in_kernelmode
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '1.0E-9'
              master_item:
                key: 'docker.container_stats["{#NAME}"]'
              tags:
                - tag: component
                  value: cpu
                - tag: container
                  value: '{#NAME}'
            - name: 'Container {#NAME}: Throttled periods'
              type: DEPENDENT
              key: 'docker.container_stats.cpu_usage.throttled_periods["{#NAME}"]'
              history: 7d
              description: 'Number of periods when the container hits its throttling limit'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.cpu_stats.throttling_data.throttled_periods
              master_item:
                key: 'docker.container_stats["{#NAME}"]'
              tags:
                - tag: component
                  value: cpu
                - tag: container
                  value: '{#NAME}'
            - name: 'Container {#NAME}: Throttled time'
              type: DEPENDENT
              key: 'docker.container_stats.cpu_usage.throttled_time["{#NAME}"]'
              history: 7d
              value_type: FLOAT
              units: s
              description: 'Aggregate time the container was throttled for in nanoseconds'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.cpu_stats.throttling_data.throttled_time
                - type: MULTIPLIER
                  parameters:
                    - '1.0E-9'
              master_item:
                key: 'docker.container_stats["{#NAME}"]'
              tags:
                - tag: component
                  value: cpu
                - tag: container
                  value: '{#NAME}'
            - name: 'Container {#NAME}: Throttling periods'
              type: DEPENDENT
              key: 'docker.container_stats.cpu_usage.throttling_periods["{#NAME}"]'
              history: 7d
              description: 'Number of periods with throttling active'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.cpu_stats.throttling_data.periods
              master_item:
                key: 'docker.container_stats["{#NAME}"]'
              tags:
                - tag: component
                  value: cpu
                - tag: container
                  value: '{#NAME}'
            - name: 'Container {#NAME}: CPU total usage per second'
              type: DEPENDENT
              key: 'docker.container_stats.cpu_usage.total.rate["{#NAME}"]'
              history: 7d
              value_type: FLOAT
              units: s
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.cpu_stats.cpu_usage.total_usage
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '1.0E-9'
