      name: 'ping до "важных" ресурсов'
      monitored_by: PROXY
      proxy:
        name: proxy-gcm
      groups:
        - name: 'Сайты ГЦМ/ 3.1 Критические'
      items:
        - name: '81.177.34.202 (ПАК_4Ц)'
          type: SIMPLE
          key: 'icmpping[81.177.34.202,,,]'
          delay: 2m
          history: 90d
          triggers:
            - expression: 'last(/ping/icmpping[81.177.34.202,,,])=0'
              name: 'Не доступен хост 81.177.34.202 (ПАК_4Ц)'
              tags:
                - tag: дача
                  value: триггеры
            - expression: 'last(/ping/icmpping[81.177.34.202,,,])=0'
              recovery_mode: NONE
              name: 'Отсутствовал ping до 81.177.34.202 (закрывать руками)'
              priority: INFO
              manual_close: 'YES'
              dependencies:
                - name: 'Не доступен хост 81.177.34.202 (ПАК_4Ц)'
                  expression: 'last(/ping/icmpping[81.177.34.202,,,])=0'
