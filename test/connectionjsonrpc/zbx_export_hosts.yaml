            - expression: 'last(/siem.cloud.gcm/docker.server_version,#1)<>last(/siem.cloud.gcm/docker.server_version,#2) and length(last(/siem.cloud.gcm/docker.server_version))>0'
              name: 'Docker: Version has changed (new version: {ITEM.VALUE})'
              priority: INFO
              description: 'Docker version has changed. Ack to close.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
