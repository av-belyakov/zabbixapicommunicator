              parameters:
                - 'return (100 - value)'
          master_item:
            key: 'system.cpu.util[,idle]'
          tags:
            - tag: component
              value: cpu
          triggers:
            - expression: 'min(/thehive.cloud.gcm/system.cpu.util,5m)>{$CPU.UTIL.CRIT}'
              name: 'High CPU utilization'
              event_name: 'High CPU utilization (over {$CPU.UTIL.CRIT}% for 5m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'CPU utilization is too high. The system might be slow to respond.'
              dependencies:
                - name: 'Load average is too high'
                  expression: |
                    min(/thehive.cloud.gcm/system.cpu.load[all,avg1],5m)/last(/thehive.cloud.gcm/system.cpu.num)>{$LOAD_AVG_PER_CPU.MAX.WARN}
                    and last(/thehive.cloud.gcm/system.cpu.load[all,avg5])>0
                    and last(/thehive.cloud.gcm/system.cpu.load[all,avg15])>0
              tags:
                - tag: scope
                  value: performance
