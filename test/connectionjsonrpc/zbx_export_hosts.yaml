          master_item:
            key: docker.data_usage
          tags:
            - tag: component
              value: storage
        - name: 'Сработки с КУ'
          key: file.alerts
          history: 90d
          interface_ref: if1
          triggers:
            - expression: 'last(/siem.cloud.gcm/file.alerts)>1000 and last(/siem.cloud.gcm/file.alerts,#1)>last(/siem.cloud.gcm/file.alerts,#2)'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/siem.cloud.gcm/file.alerts,#1)<last(/siem.cloud.gcm/file.alerts,#2)'
              name: 'Сработки с КУ не отправляются! Проблема с Parser'
              priority: DISASTER
              description: 'Триггер срабатывает если на КУ сработок более 1000 и последние значение больше предыдущего.'
              manual_close: 'YES'
        - name: 'Maximum number of open file descriptors'
          key: kernel.maxfiles
          delay: 1h
          history: 7d
          description: 'It could be increased by using sysctrl utility or modifying file /etc/sysctl.conf.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          interface_ref: if1
          tags:
            - tag: Application
              value: General
          triggers:
            - expression: 'last(/siem.cloud.gcm/kernel.maxfiles)<{$KERNEL.MAXFILES.MIN}'
              name: 'Configured max number of open filedescriptors is too low (< {$KERNEL.MAXFILES.MIN})'
              priority: INFO
        - name: 'Maximum number of processes'
          key: kernel.maxproc
          delay: 1h
          history: 7d
          description: 'It could be increased by using sysctrl utility or modifying file /etc/sysctl.conf.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          interface_ref: if1
          tags:
            - tag: Application
              value: General
          triggers:
            - expression: 'last(/siem.cloud.gcm/kernel.maxproc)<{$KERNEL.MAXPROC.MIN}'
              name: 'Configured max number of processes is too low (< {$KERNEL.MAXPROC.MIN})'
              priority: INFO
              dependencies:
                - name: 'Getting closer to process limit (over 80% used)'
                  expression: 'last(/siem.cloud.gcm/proc.num)/last(/siem.cloud.gcm/kernel.maxproc)*100>80'
        - name: 'контейнер mail_attach'
          type: TRAP
          key: mail_attach
          history: 90d
          value_type: TEXT
        - name: 'Number of processes'
          key: proc.num
          history: 7d
          interface_ref: if1
          tags:
            - tag: Application
              value: General
        - name: 'Number of running processes'
          key: 'proc.num[,,run]'
          history: 7d
          interface_ref: if1
          tags:
            - tag: Application
              value: General
        - name: sib_clean_date
          key: sib_clean_date
          delay: '0;md1h0,1m0-50/50'
          history: 90d
          value_type: TEXT
          preprocessing:
            - type: DISCARD_UNCHANGED
          interface_ref: if1
          triggers:
            - expression: 'last(/siem.cloud.gcm/sib_clean_date,#1)=last(/siem.cloud.gcm/sib_clean_date,#2)'
              name: 'Очистка БД не выполнена, Sib Cleaner не отработал!'
              priority: DISASTER
              manual_close: 'YES'
        - name: 'System boot time'
          key: system.boottime
          delay: 15m
          history: 7d
          units: unixtime
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          interface_ref: if1
          tags:
            - tag: Application
              value: General
        - name: 'Interrupts per second'
          key: system.cpu.intr
          history: 7d
          value_type: FLOAT
          preprocessing:
            - type: CHANGE_PER_SECOND
          interface_ref: if1
          tags:
            - tag: Application
              value: CPU
        - name: 'Load average (1m avg)'
          key: 'system.cpu.load[all,avg1]'
          history: 7d
