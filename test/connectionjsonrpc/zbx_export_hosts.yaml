              description: 'Zabbix has not received data for items for the last 30 minutes'
              manual_close: 'YES'
              dependencies:
                - name: 'Docker: Service is down'
                  expression: last(/siem.cloud.gcm/docker.ping)=0
              tags:
                - tag: scope
                  value: availability
        - name: 'Docker: NCPU'
