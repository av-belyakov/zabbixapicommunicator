              master_item:
                key: 'docker.container_stats["{#NAME}"]'
              tags:
                - tag: component
                  value: network
                - tag: container
                  value: '{#NAME}'
          trigger_prototypes:
            - expression: 'last(/es-siem-db/docker.container_info.state.exitcode["{#NAME}"])>0 and last(/es-siem-db/docker.container_info.state.running["{#NAME}"])=0'
              name: 'Container {#NAME}: Container has been stopped with error code'
              opdata: 'Exit code: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
          graph_prototypes:
            - name: 'Container {#NAME}: CPU usage'
              type: STACKED
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 1A7C11
                  item:
                    host: es-siem-db
                    key: 'docker.container_stats.cpu_usage.kernel.rate["{#NAME}"]'
                - sortorder: '1'
                  drawtype: GRADIENT_LINE
                  color: 2774A4
                  item:
                    host: es-siem-db
                    key: 'docker.container_stats.cpu_usage.user.rate["{#NAME}"]'
                - sortorder: '2'
                  drawtype: GRADIENT_LINE
                  color: F63100
                  item:
                    host: es-siem-db
                    key: 'docker.container_stats.cpu_usage.total.rate["{#NAME}"]'
            - name: 'Container {#NAME}: Memory usage'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 1A7C11
                  item:
